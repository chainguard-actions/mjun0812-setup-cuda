name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          cache: true
          node-version-file: .node-version

      - name: Build
        run: vp pack

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist folder is not up to date. Please run 'vp pack' locally and commit again."
            exit 1
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" --generate-notes

      - name: Update Major Tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          GITHUB_REF_NAME="$REF_NAME"
          MAJOR_TAG=${GITHUB_REF_NAME%%.*}
          echo "Updating $MAJOR_TAG to point to $GITHUB_REF_NAME"
          git tag -fa "$MAJOR_TAG" -m "$MAJOR_TAG"
          git push origin "$MAJOR_TAG" --force
