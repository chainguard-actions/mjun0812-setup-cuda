name: Test basic usage - invalid version error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "99.99.99"
          method: auto
        continue-on-error: true
      - name: Assert action failed for unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unknown CUDA version 99.99.99, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown CUDA version"
