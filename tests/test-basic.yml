name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert outputs are set or action ran
        env:
          VERSION_OUT: ${{ steps.action.outputs.version }}
          CUDA_PATH_OUT: ${{ steps.action.outputs['cuda-path'] }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version output: $VERSION_OUT"
          echo "cuda-path output: $CUDA_PATH_OUT"
          # The action should either succeed (with outputs) or fail gracefully
          # In a non-GPU environment, installation may fail — that is acceptable.
          # We just verify the action ran (outcome is success or failure, not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
