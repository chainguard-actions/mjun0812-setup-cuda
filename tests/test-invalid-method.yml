name: Test invalid method input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '12.4'
          method: bogus
      - name: Assert action failed and set no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          CUDA_PATH_OUT: ${{ steps.action.outputs.cuda-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "cuda-path: $CUDA_PATH_OUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid method, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VERSION" ] || [ -n "$CUDA_PATH_OUT" ]; then
            echo "FAIL: outputs should not be set on failure"
            exit 1
          fi
          echo "PASS"
