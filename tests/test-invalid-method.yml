name: Test invalid method input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: latest
          method: invalid-method
        continue-on-error: true

      - name: Assert action failed with invalid method error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid method, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid method"
