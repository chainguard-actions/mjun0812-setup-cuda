name: Test local install method with Major.Minor version format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "12.4"
          method: local
        continue-on-error: true
      - name: Assert action ran with local method and Major.Minor version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION_OUT: ${{ steps.action.outputs.version }}
          CUDA_PATH_OUT: ${{ steps.action.outputs.cuda-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version output: $VERSION_OUT"
          echo "cuda-path output: $CUDA_PATH_OUT"
          # In a Docker environment without NVIDIA drivers, failure is expected
          # We verify the action ran (either succeeded or failed gracefully)
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$VERSION_OUT" ]; then
              echo "FAIL: version output should not be empty on success"
              exit 1
            fi
            # When Major.Minor is given, the output should start with '12.4.'
            if [[ "$VERSION_OUT" != 12.4.* ]]; then
              echo "FAIL: expected version starting with '12.4.', got '$VERSION_OUT'"
              exit 1
            fi
            if [ -z "$CUDA_PATH_OUT" ]; then
              echo "FAIL: cuda-path output should not be empty on success"
              exit 1
            fi
            echo "PASS: local method with Major.Minor version works correctly"
          else
            echo "Action failed (expected in Docker environment without NVIDIA drivers)"
            echo "PASS: action ran and failed gracefully"
          fi
