name: Test specific non-existent version - error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.1.0"
          method: auto
        continue-on-error: true
      - name: Assert action failed for non-existent CUDA version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent CUDA version 0.1.0, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent CUDA version"
