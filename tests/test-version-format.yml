name: Test version format Major.Minor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action will attempt to find and install CUDA 12.x (latest patch).
      # In a test environment without GPU drivers, installation will fail,
      # but we verify the action correctly resolves the Major.Minor version format
      # and fails at the installation step (not at version parsing).
      - id: action
        uses: .
        with:
          version: "12.0"
          method: local
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail (not be skipped).
          # In a test environment without GPU drivers, failure is expected.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
